[package]
name = "pdf-probe"
version = "0.5.1"
edition = "2024"
description = "A small, fail-closed reader that answers two questions about an untrusted PDF: how many pages, and how big is each page."
license = "MIT OR Apache-2.0"
repository = "https://github.com/polybot-platform/pdf-probe"
readme = "README.md"
# Edition 2024 needs 1.85, and the parser uses `let` chains, which are stable from 1.88.
rust-version = "1.88"
keywords = ["pdf", "page-count", "page-size", "untrusted-input", "no-dependencies"]
categories = ["parser-implementations", "web-programming"]
# Only the library ships. ffi/, fuzz/, examples/, bindings/, npm/, corpus/ and the tooling stay in the repository.
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[workspace]
members = ["ffi"]
# fuzz/ is its own workspace (cargo-fuzz builds it with a nightly toolchain).
exclude = ["fuzz"]

[dependencies]

[features]
# FOR TESTS ONLY, never in a build you ship: parsing the name /PdfProbeForcePanic as a value panics. It lets the
# tests of the native library and the wasm module check what a real panic in the parser does to the host. Build
# it in its own target directory (CARGO_TARGET_DIR=target/force-panic) so it can't replace a normal build.
_force-panic = []

[lints.rust]
unsafe_code = "forbid"

# `panic` stays at its default (unwind) so the native library can catch a panic at its boundary and return a
# status instead of taking the host process down. A wasm profile can set `panic = "abort"`.
[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

# For fuzzing (`cargo run --profile fuzz --example fuzz`): optimised, but unwinding (so a panic can be caught and
# reported) and with overflow checks, which the release profile turns into silent wrapping.
[profile.fuzz]
inherits = "release"
panic = "unwind"
debug-assertions = true
overflow-checks = true
lto = false
codegen-units = 16

# For the wasm build (`cargo build --profile wasm --target wasm32-unknown-unknown -p pdf-probe-ffi`): small, and
# `panic = "abort"`, which is the only option on wasm32-unknown-unknown (a panic becomes a trap).
[profile.wasm]
inherits = "release"
panic = "abort"
opt-level = "z"

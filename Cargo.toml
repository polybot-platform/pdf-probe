[package]
name = "pdf-probe"
version = "0.0.0"
edition = "2024"
description = "A small, fail-closed reader that answers two questions about an untrusted PDF: how many pages, and how big is each page."
license = "MIT OR Apache-2.0"
repository = "https://github.com/polybot-platform/pdf-probe"
# Not published yet. The crates.io name is reserved separately; see the project issue.
publish = false

[workspace]
members = ["ffi"]
# fuzz/ is its own workspace (cargo-fuzz builds it with a nightly toolchain).
exclude = ["fuzz"]

[dependencies]

[lints.rust]
unsafe_code = "forbid"

# `panic` stays at its default (unwind) so the native library can catch a panic at its boundary and return a
# status instead of taking the host process down. A wasm profile can set `panic = "abort"`.
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true

# For fuzzing (`cargo run --profile fuzz --example fuzz`): optimised, but unwinding (so a panic can be caught and
# reported) and with overflow checks, which the release profile turns into silent wrapping.
[profile.fuzz]
inherits = "release"
panic = "unwind"
debug-assertions = true
overflow-checks = true
lto = false
codegen-units = 16

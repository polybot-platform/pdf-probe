name: Release

# Publishes the crate to crates.io and the npm packages when a version tag is pushed (git tag v0.5.0 && git push
# origin v0.5.0). The native libraries are built, tested and packed from the tagged commit first (native.yml).
# There is no API token: crates.io and npm trust this workflow (a "trusted publisher" in each package's settings)
# and hand it a token that lives for this run only. See docs/releasing.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify the tag and the package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Actions here are pinned to a commit, not a tag: this workflow publishes.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # the check needs origin/main to see that the tag is on it
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: Check the tag against Cargo.toml and main
        env:
          TAG: ${{ github.ref_name }}
        run: tools/check-release.sh "$TAG"
      - run: cargo test -p pdf-probe --locked --release
      - run: cargo publish --dry-run -p pdf-probe --locked

  # Builds the native library for every platform, tests each, packs the npm packages and installs them on every
  # platform. Nothing is published until all of that has passed.
  native:
    name: Native libraries and npm packages
    needs: verify
    uses: ./.github/workflows/native.yml
    permissions:
      contents: read

  publish:
    name: Publish to crates.io
    needs: [verify, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The environment holds the approval step: the job waits here for a reviewer. It is also the name given to
    # crates.io, which only accepts a token request that comes from this environment.
    environment: release
    permissions:
      contents: read
      id-token: write # lets the job prove its identity to crates.io (OIDC); only this job gets it
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - run: cargo publish -p pdf-probe --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-npm:
    name: Publish to npm
    needs: [verify, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The same environment and approval as the crate. npm only accepts a token request from the workflow and
    # environment named in each package's trusted publisher settings.
    environment: release
    permissions:
      contents: read
      id-token: write # lets the job prove its identity to npm (OIDC), which also signs the provenance
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Check that npm can use trusted publishing (11.5.1 or later)
        run: |
          npm --version
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-tarballs
          path: tarballs
      # The tarballs that were installed and loaded on every platform, not a rebuild. Platform packages first.
      - run: tools/publish-npm.sh tarballs
